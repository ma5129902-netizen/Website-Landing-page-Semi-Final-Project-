<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rihla Egypt Travel | Reset Password</title>
    <link rel="stylesheet" href="CSS/reset-password-style.css">
    <link rel="stylesheet" href="CSS/reset-password-responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
</head>
<body>
    <section class="auth-section">
        <div class="auth-image">
            <img src="images/image 9.png" alt="Experience the magic of Egypt">
        </div>

        <div class="auth-form-wrap">
            <div class="auth-form">
                <div class="auth-logo">
                    <img src="images/Logo.svg" alt="Logo" class="auth-logo-icon">
                    
                </div>

                <h1>Reset Password</h1>
                <p>Create a new secure password for your account</p>

                <form>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-field">
                            <input type="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
                            <img src="images/eye.svg" alt="" class="password-toggle">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="password-field">
                            <input type="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
                            <img src="images/eye.svg" alt="" class="password-toggle">
                        </div>
                    </div>

                    <a href="login.html" class="btn-login">Reset Password</a>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
