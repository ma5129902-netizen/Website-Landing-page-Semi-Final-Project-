<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rihla Egypt Travel | Verify Account</title>
    <link rel="stylesheet" href="CSS/forgot-password-otp-style.css">
    <link rel="stylesheet" href="CSS/forgot-password-otp-responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
</head>
<body>
    <section class="auth-section">
        <div class="auth-image">
            <img src="images/image 9.png" alt="Experience the magic of Egypt">
        </div>

        <div class="auth-form-wrap">
            <div class="auth-form">
                <div class="auth-logo">
                    <img src="images/Logo.svg" alt="Logo" class="auth-logo-icon">
                </div>

                <h1 class="text-center">Verify Your Account</h1>
                <p class="text-center">Enter the 4-digit code sent to your phone or email.</p>

                <form>
                    <div class="otp-inputs">
                        <input type="text" maxlength="1" class="otp-box">
                        <input type="text" maxlength="1" class="otp-box">
                        <input type="text" maxlength="1" class="otp-box">
                        <input type="text" maxlength="1" class="otp-box">
                    </div>

                    <p class="otp-timer">00:30</p>

                    <a href="reset-password.html" class="btn-login">Verify Code</a>
                </form>

                <p class="auth-footer-text">Didn't receive OTP? <a href="#" class="link-orange">Send Again</a></p>
            </div>
        </div>
    </section>
</body>
</html>
