<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rihla Egypt Travel | Login</title>
    <link rel="stylesheet" href="CSS/login-style.css">
    <link rel="stylesheet" href="CSS/login-responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
</head>
<body>
    <section class="auth-section">
        <div class="auth-image">
            <img src="images/image 9.png" alt="Experience the magic of Egypt">
        </div>

        <div class="auth-form-wrap">
            <div class="auth-form">
                <div class="auth-logo">
                    <img src="images/Logo.svg" alt="Logo" class="auth-logo-icon">
                    
                </div>

                <h1>Welcome Back</h1>
                <p>Sign in to your account to continue your journey</p>

                <form>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="Mena@gmail.com">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-field">
                            <input type="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
                            <img src="images/eye.svg" alt="" class="password-toggle">
                        </div>
                    </div>

                    <div class="form-row">
                        <label class="checkbox-label">
                            <input type="checkbox">
                            Remember me
                        </label>
                        <a href="forgot-password.html" class="link-orange">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-login">Login</button>
                </form>

                <div class="divider"><span>Or continue with</span></div>

                <div class="social-buttons">
    <a href="https://accounts.google.com/signin" target="_blank" class="btn-social">
        <img src="images/Icon (2).png" alt="Google">
        Google
    </a>
    <a href="https://appleid.apple.com/sign-in" target="_blank" class="btn-social">
        <img src="images/mdi_apple.png" alt="Apple">
        Apple
    </a>
</div>

                <p class="auth-footer-text">Don't have an account? <a href="signup.html" class="link-orange">Create account</a></p>
            </div>
        </div>
    </section>
</body>
</html>
