<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rihla Egypt Travel | Forgot Password</title>
    <link rel="stylesheet" href="CSS/forgot-password-style.css">
    <link rel="stylesheet" href="CSS/forgot-password-responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
</head>
<body>
    <section class="auth-section">
        <div class="auth-image">
            <img src="images/image 9.png" alt="Experience the magic of Egypt">
        </div>

        <div class="auth-form-wrap">
            <div class="auth-form">
                <div class="auth-logo">
                    <img src="images/Logo.svg" alt="Logo" class="auth-logo-icon">
                    
                </div>

                <h1>Forgot Password?</h1>
                <p>Don't worry! Enter your email and we'll send you a verification code</p>

                <form>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="Mena@gmail.com">
                    </div>

                    <button type="submit" class="btn-login">Send Verification Code</button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
